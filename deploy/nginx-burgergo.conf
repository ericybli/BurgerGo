# BurgerGo — nginx reverse proxy for https://eric.month2month.com/burgergo
#
# Cloudflare terminates TLS (orange-cloud / proxied DNS) and connects to this
# origin over HTTP on port 80. The browser still sees HTTPS via Cloudflare, so
# the PWA's secure-context requirement (service worker, install) is satisfied.
# Set the Cloudflare SSL/TLS mode for the zone to "Flexible" (origin is HTTP).
#
# The app container (docker-compose) is built with NEXT_PUBLIC_BASE_PATH=/burgergo,
# so it serves everything under /burgergo (pages, /burgergo/_next, /burgergo/api,
# /burgergo/sw.js). We pass the URI through unchanged to the container.
#
# Install: copy to /etc/nginx/sites-available/burgergo, symlink into
# sites-enabled, `nginx -t`, then `systemctl reload nginx`. (deploy.sh does this.)

server {
    # Cloudflare connects to the origin on :80 (SSL mode "Flexible") OR :443
    # (SSL mode "Full"). We serve both so it works regardless of the zone's
    # mode. :443 uses a self-signed cert — Cloudflare "Full" accepts it (only
    # "Full (strict)" validates it, which would need a Cloudflare Origin Cert).
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name eric.month2month.com;

    ssl_certificate     /etc/nginx/ssl/burgergo-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/burgergo-selfsigned.key;

    # Allow phone photo uploads (Plan 2) without 413s.
    client_max_body_size 25m;

    # Recover the real visitor IP from Cloudflare (optional but useful in logs).
    # CF connecting IP header; ranges from https://www.cloudflare.com/ips/
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # BurgerGo lives entirely under /burgergo. proxy_pass WITHOUT a trailing
    # path preserves the original URI (/burgergo/...), which is what the
    # basePath-built container expects.
    location /burgergo {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloudflare already served the client over HTTPS; tell Next so it
        # generates https absolute URLs / deep-links correctly.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # Everything else on this host is not BurgerGo. Return 404 rather than
    # leaking a default page (leave room for other apps to add their own block).
    location = / {
        return 404;
    }
}
