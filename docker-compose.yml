services:
  app:
    build:
      context: .
      args:
        # NEXT_PUBLIC_* are inlined at build time into the client bundle.
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
        NEXT_PUBLIC_MAP_PROVIDER: ${NEXT_PUBLIC_MAP_PROVIDER:-}
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN:-}
    image: burgergo:latest
    restart: unless-stopped
    ports:
      # Bind to loopback only: reachable solely via the host's nginx reverse
      # proxy (which Cloudflare fronts), never directly on the public IP:3000.
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_PATH: /data/burgergo.db
      UPLOADS_DIR: /data/uploads
      # Runtime copy so the healthcheck can build the <basePath>/api/health probe URL.
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
      NEXT_PUBLIC_MAP_PROVIDER: ${NEXT_PUBLIC_MAP_PROVIDER:-}
      NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN:-}
      GOOGLE_MAPS_SERVER_KEY: ${GOOGLE_MAPS_SERVER_KEY:-}
      # Server-only (NOT a build arg / not NEXT_PUBLIC). Powers AI place summaries.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-USD}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en}
      TZ: ${TZ:-UTC}
    volumes:
      - burgergo-db:/data
      - burgergo-uploads:/data/uploads
    healthcheck:
      # Under a sub-path deploy the app serves at <basePath>/api/health, so the probe
      # URL must include NEXT_PUBLIC_BASE_PATH. `$$` escapes the compose interpolation
      # so the var is read from the container's runtime environment.
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000'+(process.env.NEXT_PUBLIC_BASE_PATH||'')+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  burgergo-db:
  burgergo-uploads:
